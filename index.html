<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
        <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
        <title>Basketball Stars | 3kh0</title>

        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    </head>
    <script src="/js/main.js"></script>
    <body>
        <div id="content"></div>
        <div id="orientation"></div>
        <div id="loader">Loading ...</div>

        <!-- ERROR LOGGING CONTAINER -->
        <div id="debug-log" style="position:fixed; bottom:10px; left:10px; color:#ff3333; background:rgba(0,0,0,0.8); z-index:99999; font-family:monospace; font-size:12px; pointer-events:none; padding:5px; border-radius:4px; display:none;"></div>

        <script>
            window.addEventListener('error', (event) => {
                const log = document.getElementById('debug-log');
                log.style.display = 'block';
                log.innerHTML += `<div>ERROR: ${event.message}</div>`;
            });
        </script>

        <script type="text/javascript" src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
        <script type="text/javascript" src="assets/box2dweb/nape.min.js">
            var nape ="nape.min.js" ;
        </script>
        <script type="text/javascript" src="assets/box2dweb/nape-debug-draw.min.js"></script>
        <script type="text/javascript" src="assets/box2dweb/jquery-3.1.1.min.js"></script>
        <script type="text/javascript" src="assets/box2dweb/easeljs-0.8.2.combined.js"></script>
        <script type="text/javascript" src="assets/box2dweb/bluebird.min.js"></script>
        <script type="text/javascript">
            var useEvents = typeof Event === "function";

            var myDispatchEvent = function (name) {
                var event;
                if (useEvents) {
                    event = new Event(name);
                } else {
                    event = document.createEvent("Event");
                    event.initEvent(name, true, true);
                }
                document.getElementById("content").dispatchEvent(event);
            };

            window["GD_OPTIONS"] = {
                gameId: "69d78d071f704fa183d75b4114ae40ec",
                onEvent: function (event) {
                    switch (event.name) {
                        case "SDK_GAME_START":
                            myDispatchEvent("SDK_GAME_START");
                            break;
                        case "SDK_GAME_PAUSE":
                            myDispatchEvent("SDK_GAME_PAUSE");
                            break;
                    }
                },
            };
            (function (d, s, id) {
                var js,
                    fjs = d.getElementsByTagName(s)[0];
                if (d.getElementById(id)) return;
                js = d.createElement(s);
                js.id = id;
                js.charset = "utf-8";
                js.src = "assets/main.min.js";
                fjs.parentNode.insertBefore(js, fjs);
            })(document, "script", "gamedistribution-jssdk");
        </script>
        <script type="text/javascript" charset="utf-8" src="assets/basketball_legends_2019.min.js"></script>

        <!-- ===== ONLINE MULTIPLAYER OVERLAYS (only shown from the 2 PLAYERS button) ===== -->
        <style>
          .net-panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#111e2e; color:#fff;
            padding:22px; border-radius:10px; box-shadow:0 0 24px rgba(0,0,0,.85); font-family:Arial,sans-serif; z-index:10000;
            width:320px; max-width:90vw; max-height:85vh; overflow-y:auto; display:none; text-align:center; }
          .net-panel h2 { margin:0 0 14px; font-size:20px; }
          .net-btn { display:block; width:100%; background:#00ccff; border:none; padding:10px 14px; color:#000; font-weight:bold;
            cursor:pointer; border-radius:4px; margin:8px 0; font-size:15px; }
          .net-btn.grey { background:#667; color:#fff; }
          .net-btn.green { background:#2ee66b; }
          .net-input { width:93%; padding:8px; margin:6px 0; background:#0b141f; border:1px solid #334e68; color:#fff; border-radius:4px; }
          .net-room { background:#1b2a3a; padding:8px; margin:4px 0; display:flex; justify-content:space-between; align-items:center; border-radius:4px; }
          #net-banner { position:fixed; top:6px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
            font-family:Arial,sans-serif; font-size:13px; padding:6px 12px; border-radius:6px; z-index:9000; display:none; pointer-events:none; }
          #net-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff;
            font-family:Arial,sans-serif; font-size:14px; padding:8px 14px; border-radius:6px; z-index:10001; display:none; }
        </style>

        <div id="net-chooser" class="net-panel">
          <h2>2 PLAYERS</h2>
          <button class="net-btn" id="net-local">Local (same keyboard)</button>
          <button class="net-btn green" id="net-online">Online Multiplayer</button>
          <button class="net-btn grey" id="net-chooser-cancel">Cancel</button>
        </div>

        <div id="net-lobby" class="net-panel">
          <h2>Online Matchmaking</h2>
          <div id="net-menu">
            <button class="net-btn" id="net-show-host">Host Game</button>
            <button class="net-btn" id="net-show-join">Join with Code</button>
            <div style="text-align:left;margin-top:12px;font-weight:bold;">Public Rooms</div>
            <div id="net-rooms" style="max-height:130px;overflow-y:auto;"></div>
            <button class="net-btn grey" id="net-lobby-close">Back</button>
          </div>
          <div id="net-host" style="display:none;">
            <label><input type="checkbox" id="net-private"> Private room</label>
            <input type="text" id="net-key" class="net-input" placeholder="Password" style="display:none;">
            <button class="net-btn" id="net-create">Create Room</button>
            <button class="net-btn grey" id="net-host-back">Back</button>
          </div>
          <div id="net-join" style="display:none;">
            <input type="text" id="net-join-id" class="net-input" placeholder="Room code (e.g. AB12C)">
            <input type="text" id="net-join-key" class="net-input" placeholder="Password (private rooms)">
            <button class="net-btn" id="net-join-go">Connect</button>
            <button class="net-btn grey" id="net-join-back">Back</button>
          </div>
          <div id="net-wait" style="display:none;">
            <div id="net-wait-text" style="margin:8px 0;"></div>
            <button class="net-btn green" id="net-start" style="display:none;">NEXT: PICK PLAYERS</button>
            <button class="net-btn grey" id="net-wait-leave">Leave</button>
          </div>
          <div id="net-status" style="margin-top:8px;color:#00ffcc;min-height:18px;"></div>
        </div>

        <div id="net-banner"></div>
        <div id="net-toast"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
        (function () {
          var socket = io();
          window.socket = socket;
          var ns = window.netState = { online: false, isHost: false, isGuest: false, mySide: 0, inGame: false };
          window.latestHostState = null;
          window.remoteP2Input = null;
          window.netEvtQueue = [];

          var $ = function (id) { return document.getElementById(id); };
          var role = null, enterCb = null, rematchAsked = false;

          function showEl(id, on) { $(id).style.display = on ? 'block' : 'none'; }
          function toast(msg, ms) {
            var t = $('net-toast'); t.textContent = msg; t.style.display = 'block';
            clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2500);
          }
          function banner(msg) { var b = $('net-banner'); if (msg) { b.textContent = msg; b.style.display = 'block'; } else { b.style.display = 'none'; } }
          function lobbyPane(name) {
            ['net-menu', 'net-host', 'net-join', 'net-wait'].forEach(function (id) { showEl(id, id === name); });
          }
          function inv() { return window.GameInventory.instance; }

          /* ---------- public API used by the patched game bundle ---------- */
          window.NetUI = {
            choose2P: function (cb) {
              showEl('net-chooser', true);
              $('net-local').onclick = function () { showEl('net-chooser', false); cb('local'); };
              $('net-online').onclick = function () { showEl('net-chooser', false); cb('online'); };
              $('net-chooser-cancel').onclick = function () { showEl('net-chooser', false); };
            },
            openLobby: function (cb) {
              enterCb = cb; role = null;
              $('net-status').textContent = '';
              lobbyPane('net-menu'); showEl('net-lobby', true);
              socket.emit('get_public_rooms');
            },
            leave: function () { try { socket.disconnect(); } catch (e) {} location.reload(); },
            rematch: function () {
              if (rematchAsked) return;
              rematchAsked = true; socket.emit('rematch_req'); toast('Waiting for opponent…', 4000);
            }
          };
          window.NetSync = { send: function (k, d) { socket.emit('evt', { k: k, d: d }); } };

          window.NetSel = {
            sel: null, last: {}, pending: {},
            canEdit: function (id) { return !ns.online || id === ns.mySide; },
            changed: function (id) {
              if (!ns.online || id !== ns.mySide) return;
              var md = inv().matchData;
              var v = { id: id, team: md.teams[id], ch: md.players[id][0] };
              var key = v.team + ':' + v.ch;
              if (this.last[id] === key) return;
              this.last[id] = key;
              socket.emit('pick', v);
            },
            apply: function (v) {
              var st = this.sel;
              var sp = st && (v.id === 0 ? st.selectPlayer : st.selectPlayer2);
              if (!sp) { this.pending[v.id] = v; return; }
              inv().matchData.players[v.id][0] = v.ch;
              sp.__remote = true;
              try { sp.emblem = v.team; sp.updateClub(); } finally { sp.__remote = false; }
            },
            onSelectReady: function (state) {
              if (!ns.online) return;
              this.sel = state;
              banner('ONLINE – you are Player ' + (ns.mySide + 1) + (ns.mySide === 0 ? ' (left)' : ' (right)') +
                     '. Pick your own team & player. ' + (ns.isHost ? 'Press PLAY when ready.' : 'Waiting for the host to press PLAY.'));
              var self = this;
              Object.keys(this.pending).forEach(function (k) { self.apply(self.pending[k]); });
              this.pending = {};
              this.last = {};
              this.changed(ns.mySide);
            },
            hostStart: function () {
              var md = inv().matchData;
              socket.emit('start_match', { teams: md.teams.slice(), players: [[md.players[0][0]], [md.players[1][0]]] });
            }
          };

          /* ---------- lobby wiring ---------- */
          $('net-show-host').onclick = function () { lobbyPane('net-host'); };
          $('net-show-join').onclick = function () { lobbyPane('net-join'); };
          $('net-host-back').onclick = $('net-join-back').onclick = function () { lobbyPane('net-menu'); };
          $('net-lobby-close').onclick = function () { showEl('net-lobby', false); };
          $('net-wait-leave').onclick = function () { window.NetUI.leave(); };
          $('net-private').onchange = function (e) { $('net-key').style.display = e.target.checked ? 'block' : 'none'; };
          $('net-create').onclick = function () {
            socket.emit('create_room', { isPrivate: $('net-private').checked, passkey: $('net-key').value });
          };
          $('net-join-go').onclick = function () {
            socket.emit('join_room', { roomId: $('net-join-id').value, passkey: $('net-join-key').value });
          };
          $('net-start').onclick = function () { socket.emit('start_select'); };
          window.joinPublic = function (id) { socket.emit('join_room', { roomId: id, passkey: null }); };

          socket.on('public_rooms_update', function (rooms) {
            var box = $('net-rooms'); box.innerHTML = '';
            if (!rooms.length) { box.innerHTML = '<p style="color:#888;">No public games available.</p>'; return; }
            rooms.forEach(function (r) {
              var d = document.createElement('div'); d.className = 'net-room';
              d.innerHTML = '<span>' + r.roomId + '</span><button class="net-btn" style="width:70px;margin:0;padding:6px;" onclick="joinPublic(\'' + r.roomId + '\')">Join</button>';
              box.appendChild(d);
            });
          });
          socket.on('room_created', function (d) {
            role = 'host'; lobbyPane('net-wait');
            $('net-wait-text').innerHTML = 'Room code: <b style="font-size:22px">' + d.roomId + '</b><br>Waiting for Player 2…';
            $('net-start').style.display = 'none';
          });
          socket.on('joined_room', function (d) {
            role = 'guest'; lobbyPane('net-wait');
            $('net-wait-text').textContent = 'Connected to ' + d.roomId + '. Waiting for the host…';
            $('net-start').style.display = 'none';
          });
          socket.on('player_connected', function () {
            $('net-wait-text').innerHTML += '<br><span style="color:#2ee66b">Player 2 connected!</span>';
            $('net-start').style.display = 'block';
          });
          socket.on('join_error', function (m) { $('net-status').textContent = m; });

          socket.on('enter_select', function () {
            showEl('net-lobby', false);
            ns.online = true; ns.isHost = role === 'host'; ns.isGuest = role === 'guest';
            ns.mySide = ns.isHost ? 0 : 1; ns.inGame = false;
            window.latestHostState = null; window.remoteP2Input = null; window.netEvtQueue.length = 0;
            var cb = enterCb; enterCb = null;
            if (cb) cb();   // runs the game's own 2-player flow -> native selector
          });

          /* ---------- selector + match start ---------- */
          socket.on('peer_pick', function (v) { window.NetSel.apply(v); });
          socket.on('net_start', function (payload) {
            window.latestHostState = null; window.remoteP2Input = null; window.netEvtQueue.length = 0;
            rematchAsked = false; banner(null);
            var st = window.NetSel.sel || window.Phaser.GAMES[0].state.getCurrentState();
            st.netStart(payload);
          });

          /* ---------- gameplay relays ---------- */
          socket.on('snap', function (s) { s.rt = Date.now(); window.latestHostState = s; });
          socket.on('evt', function (e) {
            var q = window.netEvtQueue; q.push(e); if (q.length > 300) q.shift();
          });
          socket.on('g_input', function (d) { window.remoteP2Input = d; });

          /* ---------- rematch / disconnect ---------- */
          socket.on('peer_wants_rematch', function () { toast('Opponent wants a rematch – press RESTART to accept', 4000); });
          socket.on('net_rematch', function () {
            window.latestHostState = null; window.remoteP2Input = null; window.netEvtQueue.length = 0;
            rematchAsked = false;
            window.Phaser.GAMES[0].state.getCurrentState().netRematch();
          });
          socket.on('opponent_disconnected', function () {
            if (ns.online) { alert('Opponent disconnected.'); location.reload(); }
            else { lobbyPane('net-menu'); $('net-status').textContent = 'Opponent left the room.'; role = null; }
          });
        })();
        </script>
    </body>
</html>
