        <script type="text/javascript">
            var useEvents = typeof Event === "function";

            var myDispatchEvent = function (name) {
                var event;
                if (useEvents) {
                    event = new Event(name);
                } else {
                    event = document.createEvent("Event");
                    event.initEvent(name, true, true);
                }
                document.getElementById("content").dispatchEvent(event);
            };

            window["GD_OPTIONS"] = {
                gameId: "69d78d071f704fa183d75b4114ae40ec",
                onEvent: function (event) {
                    switch (event.name) {
                        case "SDK_GAME_START":
                            myDispatchEvent("SDK_GAME_START");
                            break;
                        case "SDK_GAME_PAUSE":
                            myDispatchEvent("SDK_GAME_PAUSE");
                            break;
                    }
                },
            };
            (function (d, s, id) {
                var js,
                    fjs = d.getElementsByTagName(s)[0];
                if (d.getElementById(id)) return;
                js = d.createElement(s);
                js.id = id;
                js.charset = "utf-8";
                js.src = "assets/main.min.js?v=3";
                fjs.parentNode.insertBefore(js, fjs);
            })(document, "script", "gamedistribution-jssdk");
        </script>

            padding:22px; border-radius:10px; box-shadow:0 0 24px rgba(0,0,0,.85); font-family:Arial,sans-serif; z-index:10000;
            width:340px; max-width:92vw; max-height:88vh; overflow-y:auto; display:none; text-align:center; box-sizing:border-box; }
          .net-panel h2 { margin:0 0 14px; font-size:20px; }
          .net-btn { display:block; width:100%; background:#00ccff; border:none; padding:10px 14px; color:#000; font-weight:bold;
            cursor:pointer; border-radius:4px; margin:8px 0; font-size:15px; }
          .net-btn.grey { background:#667; color:#fff; }

          .net-room { background:#1b2a3a; padding:8px; margin:4px 0; display:flex; justify-content:space-between; align-items:center; border-radius:4px; text-align:left; }
          .net-keyrow { display:flex; align-items:center; gap:6px; margin:6px 0; text-align:left; font-size:14px; }

          .net-mini { background:#00ccff; border:none; color:#000; font-weight:bold; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:12px; }
          .net-mini.grey { background:#667; color:#fff; }
          #net-banner { position:fixed; top:6px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
            font-family:Arial,sans-serif; font-size:13px; padding:6px 12px; border-radius:6px; z-index:9000; display:none; pointer-events:none; max-width:90vw; text-align:center; }

        <script src="/socket.io/socket.io.js"></script>
        <script>
        (function () {
          var socket = io();
          window.socket = socket;
          var ns = window.netState = { online: false, isHost: false, isGuest: false, mySide: 0, inGame: false, names: ['Player 1', 'Player 2'] };
          window.latestHostState = null;
          window.remoteP2Input = null;
          window.netEvtQueue = [];
          window.NetPing = { rtt: 0 };

          var $ = function (id) { return document.getElementById(id); };
          var store = {
            get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
          };
          window.NetOpts = { predict: store.get('bs_predict') !== '0' };

          var role = null, enterCb = null, rematchAsked = false;

          function showEl(id, on) { $(id).style.display = on ? 'block' : 'none'; }
          function toast(msg, ms) {
            var t = $('net-toast'); t.textContent = msg; t.style.display = 'block';
            clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2500);
          }
          function banner(msg) { var b = $('net-banner'); if (msg) { b.textContent = msg; b.style.display = 'block'; } else { b.style.display = 'none'; } }
          function lobbyPane(name) {
            ['net-menu', 'net-host', 'net-join', 'net-wait'].forEach(function (id) { showEl(id, id === name); });
          }
          function inv() { return window.GameInventory.instance; }

          /* ================= USERNAME ================= */
          function cleanName(n) { return String(n || '').replace(/[^\w .!\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12); }
          $('net-name').value = cleanName(store.get('bs_name') || '');
          function requireName() {
            var n = cleanName($('net-name').value);
            if (!n) { $('net-status').textContent = 'Enter a username first.'; $('net-name').focus(); return null; }
            $('net-name').value = n; store.set('bs_name', n);
            return n;
          }

          /* ================= CUSTOM KEYBINDS =================
             The game polls fixed physical keys. Instead of touching every controller, the
             keyboard layer is wrapped: a custom key is translated into the game's own default
             keys for that action, and the replaced default keys are switched off. */
          var CANON = { left: [65, 37], right: [68, 39], jump: [87, 38], down: [83, 40], hit: [66, 76, 88], ability: [86, 75, 90] };
          var ORDER = ['left', 'right', 'jump', 'down', 'hit', 'ability'];
          var TITLES = { left: 'Move left', right: 'Move right', jump: 'Jump', down: 'Block / pump', hit: 'Hit (shoot / steal)', ability: 'Ability (super)' };
          var DEFAULTS = { left: 'A / ←', right: 'D / →', jump: 'W / ↑', down: 'S / ↓', hit: 'B / L / X', ability: 'V / K / Z' };
          var binds = {};
          try { binds = JSON.parse(store.get('bs_keys') || '{}') || {}; } catch (e) { binds = {}; }
          Object.keys(binds).forEach(function (a) {
            if (!CANON[a] || !binds[a] || typeof binds[a].kc !== 'number') delete binds[a];
          });
          function saveKeys() { store.set('bs_keys', JSON.stringify(binds)); }

          function shouldRemap() {
            if (ns.online) return true;
            try { var i = window.GameInventory && window.GameInventory.instance; return !(i && i.gameMode === 4); } catch (e) { return true; }
          }
          var KB = window.KB = {
            capturing: false,
            targets: function (kc) {
              if (!shouldRemap()) return null;
              var any = false, a;
              for (a in binds) { any = true; if (binds[a].kc === kc) return CANON[a]; }
              if (!any) return null;
              for (a in binds) { if (CANON[a].indexOf(kc) >= 0) return []; }   // default key of a rebound action -> off
              return null;
            },
            abilityLabel: function () { return binds.ability ? String(binds.ability.label).slice(0, 5) : null; }
          };

          try {
            var KP = window.Phaser.Keyboard.prototype;
            if (!KP.__kbWrapped) {
              KP.__kbWrapped = true;
              var proxy = function (ev, kc) {
                return {
                  keyCode: kc, which: kc, charCode: ev.charCode, altKey: ev.altKey, ctrlKey: ev.ctrlKey,
                  shiftKey: ev.shiftKey, metaKey: ev.metaKey, type: ev.type, target: ev.target,
                  timeStamp: ev.timeStamp, repeat: ev.repeat,
                  preventDefault: function () { ev.preventDefault(); },
                  stopPropagation: function () { ev.stopPropagation(); }
                };
              };
              var wrap = function (orig) {
                return function (ev) {
                  var t = ev && ev.target;
                  // typing in the username / room boxes must not reach the game
                  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
                  if (KB.capturing) return;
                  var codes = KB.targets(ev.keyCode);
                  if (codes === null) return orig.call(this, ev);
                  if (ev.type === 'keydown') ev.preventDefault();
                  for (var i = 0; i < codes.length; i++) orig.call(this, codes[i] === ev.keyCode ? ev : proxy(ev, codes[i]));
                };
              };
              KP.processKeyDown = wrap(KP.processKeyDown);
              KP.processKeyUp = wrap(KP.processKeyUp);
            }
          } catch (e) { console.warn('keybind layer unavailable', e); }

          function labelFor(ev) {
            var map = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ' ': 'SPACE', Enter: 'ENTER', Tab: 'TAB', Backspace: 'BKSP' };
            var k = ev.key;
            if (map[k]) return map[k];
            if (k && k.length === 1) return k.toUpperCase();
            return String(ev.code || k || '?').replace(/^(Key|Digit)/, '').toUpperCase();
          }
          function validate(action, kc) {
            var a;
            for (a in binds) if (a !== action && binds[a].kc === kc) return 'That key is already used for "' + TITLES[a] + '".';
            for (a in CANON) if (a !== action && !binds[a] && CANON[a].indexOf(kc) >= 0) return 'That key is the default for "' + TITLES[a] + '" – rebind that action first.';
            return null;
          }
          function startCapture(action, cell) {
            if (KB.capturing) return;
            KB.capturing = true;
            cell.textContent = 'Press a key… (Esc cancels)';
            var onKey = function (ev) {
              ev.preventDefault(); ev.stopImmediatePropagation();
              if (/^(Shift|Control|Alt|Meta|CapsLock)$/.test(ev.key)) return;   // modifiers alone don't count
              window.removeEventListener('keydown', onKey, true);
              KB.capturing = false;
              if (ev.key === 'Escape') { renderKeys(); return; }
              var err = validate(action, ev.keyCode);
              if (err) { toast(err, 3500); renderKeys(); return; }
              binds[action] = { kc: ev.keyCode, label: labelFor(ev) };
              saveKeys(); renderKeys();
            };
            window.addEventListener('keydown', onKey, true);
          }
          function renderKeys() {
            var box = $('net-keys'); box.innerHTML = '';
            ORDER.forEach(function (a) {
              var row = document.createElement('div'); row.className = 'net-keyrow';
              var nm = document.createElement('span'); nm.textContent = TITLES[a];
              var val = document.createElement('span'); val.className = 'net-keyval';
              val.textContent = binds[a] ? binds[a].label : 'Default (' + DEFAULTS[a] + ')';
              var ch = document.createElement('button'); ch.className = 'net-mini'; ch.textContent = 'Change';
              ch.onclick = function () { startCapture(a, val); };
              var rs = document.createElement('button'); rs.className = 'net-mini grey'; rs.textContent = 'Reset';
              rs.onclick = function () { delete binds[a]; saveKeys(); renderKeys(); };
              row.appendChild(nm); row.appendChild(val); row.appendChild(ch); row.appendChild(rs);
              box.appendChild(row);
            });
          }
          renderKeys();
          $('net-predict').checked = window.NetOpts.predict;
          $('net-predict').onchange = function (e) { window.NetOpts.predict = e.target.checked; store.set('bs_predict', e.target.checked ? '1' : '0'); };
          $('net-keys-reset').onclick = function () { binds = {}; saveKeys(); renderKeys(); };
          $('net-gear').onclick = function () { renderKeys(); showEl('net-settings', true); };
          $('net-settings-close').onclick = function () { if (!KB.capturing) showEl('net-settings', false); };
          if ('ontouchstart' in window) $('net-gear').style.display = 'none';   // touch devices use on-screen buttons

          /* ================= public API used by the patched game bundle ================= */
          window.NetUI = {
            choose2P: function (cb) {
              showEl('net-chooser', true);
              $('net-local').onclick = function () { showEl('net-chooser', false); cb('local'); };
              $('net-online').onclick = function () { showEl('net-chooser', false); cb('online'); };
              $('net-chooser-cancel').onclick = function () { showEl('net-chooser', false); };
            },
            openLobby: function (cb) {
              enterCb = cb; role = null;
              $('net-status').textContent = '';
              lobbyPane('net-menu'); showEl('net-lobby', true);
              socket.emit('get_public_rooms');
            },
            leave: function () { try { socket.disconnect(); } catch (e) {} location.reload(); },
            rematch: function () {
              if (rematchAsked) return;
              rematchAsked = true; socket.emit('rematch_req'); toast('Waiting for opponent…', 4000);
            }
          };
          /* ================= TRANSPORT: direct peer-to-peer (WebRTC) with relay fallback =================
             Game packets go straight between the two browsers when possible (no detour through the
             server). Snapshots use an unordered/unreliable channel (like UDP: a late packet is dropped
             instead of delaying the next one); inputs and events use a reliable channel. If P2P cannot
             be established (strict NAT / school network) everything silently stays on the relay. */
          var ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }, { urls: 'stun:stun.cloudflare.com:3478' }] };
          var P = { pc: null, u: null, r: null, pendingIce: [] };
          function p2pReady() { return !!(P.u && P.r && P.u.readyState === 'open' && P.r.readyState === 'open'); }
          function dcOpen(ch) { return !!(ch && ch.readyState === 'open'); }
          function dcSend(ch, k, d) {
            try { if (dcOpen(ch)) { ch.send(JSON.stringify({ k: k, d: d })); return true; } } catch (e) {}
            return false;
          }
          function onSnap(s) {
            var cur = window.latestHostState;
            if (cur && typeof s.n === 'number' && typeof cur.n === 'number' && s.n <= cur.n) return;   // stale / out of order
            s.rt = Date.now(); window.latestHostState = s;
          }
          function onEvt(e) { var q = window.netEvtQueue; q.push(e); if (q.length > 300) q.shift(); }
          function onPong(d) {
            var r = performance.now() - d.t;
            window.NetPing.rtt = window.NetPing.rtt ? window.NetPing.rtt * 0.7 + r * 0.3 : r;
          }
          function handlePacket(raw) {
            var m; try { m = JSON.parse(raw); } catch (e) { return; }
            switch (m.k) {
              case 'snap': onSnap(m.d); break;
              case 'evt': onEvt(m.d); break;
              case 'g_input': window.remoteP2Input = m.d; break;
              case 'rtt_ping': dcSend(P.u, 'rtt_pong', m.d); break;
              case 'rtt_pong': onPong(m.d); break;
            }
          }
          function wireChannel(ch) {
            ch.onmessage = function (ev) { handlePacket(ev.data); };
          }
          function stopPeer() {
            try { if (P.pc) P.pc.close(); } catch (e) {}
            P.pc = null; P.u = null; P.r = null; P.pendingIce = [];
          }
          function startPeer(initiator) {
            stopPeer();
            if (!window.RTCPeerConnection) return;
            try {
              var pc = new RTCPeerConnection(ICE);
              P.pc = pc;
              pc.onicecandidate = function (e) { if (e.candidate) socket.emit('rtc_signal', { t: 'ice', c: e.candidate }); };
              pc.ondatachannel = function (e) {
                if (e.channel.label === 'u') P.u = e.channel; else P.r = e.channel;
                wireChannel(e.channel);
              };
              if (initiator) {
                P.u = pc.createDataChannel('u', { ordered: false, maxRetransmits: 0 });
                P.r = pc.createDataChannel('r', { ordered: true });
                wireChannel(P.u); wireChannel(P.r);
                pc.createOffer()
                  .then(function (o) { return pc.setLocalDescription(o); })
                  .then(function () { socket.emit('rtc_signal', { t: 'offer', sdp: pc.localDescription }); })
                  .catch(function (e) { console.warn('p2p offer failed', e); });
              }
            } catch (e) { console.warn('p2p unavailable', e); P.pc = null; }
          }
          function flushIce() {
            var pc = P.pc; if (!pc) return;
            P.pendingIce.splice(0).forEach(function (c) { pc.addIceCandidate(c).catch(function () {}); });
          }
          socket.on('rtc_signal', function (m) {
            if (!m) return;
            if (!P.pc && m.t === 'offer') startPeer(false);
            var pc = P.pc; if (!pc) return;
            try {
              if (m.t === 'offer') {
                pc.setRemoteDescription(m.sdp)
                  .then(function () { return pc.createAnswer(); })
                  .then(function (a) { return pc.setLocalDescription(a); })
                  .then(function () { socket.emit('rtc_signal', { t: 'answer', sdp: pc.localDescription }); flushIce(); })
                  .catch(function (e) { console.warn('p2p answer failed', e); });
              } else if (m.t === 'answer') {
                pc.setRemoteDescription(m.sdp).then(flushIce).catch(function (e) { console.warn('p2p answer apply failed', e); });
              } else if (m.t === 'ice') {
                if (pc.remoteDescription) pc.addIceCandidate(m.c).catch(function () {}); else P.pendingIce.push(m.c);
              }
            } catch (e) { console.warn('p2p signal error', e); }
          });

          window.NetSend = {
            snap: function (s) {
              if (dcOpen(P.u)) { if (P.u.bufferedAmount < 262144) dcSend(P.u, 'snap', s); return; }   // congested: drop, never queue
              socket.volatile.emit('snap', s);
            },
            input: function (k) { if (!dcSend(P.r, 'g_input', k)) socket.emit('g_input', k); },
            evt: function (k, d) { if (!dcSend(P.r, 'evt', { k: k, d: d })) socket.emit('evt', { k: k, d: d }); }
          };
          window.NetSync = { send: function (k, d) { window.NetSend.evt(k, d); } };
          window.NetPath = function () { return p2pReady() ? 'p2p' : 'relay'; };

          window.NetSel = {
            sel: null, last: {}, pending: {},
            canEdit: function (id) { return !ns.online || id === ns.mySide; },
            changed: function (id) {
              if (!ns.online || id !== ns.mySide) return;
              var md = inv().matchData;
              var v = { id: id, team: md.teams[id], ch: md.players[id][0] };
              var key = v.team + ':' + v.ch;
              if (this.last[id] === key) return;
              this.last[id] = key;
              socket.emit('pick', v);
            },
            apply: function (v) {
              var st = this.sel;
              var sp = st && (v.id === 0 ? st.selectPlayer : st.selectPlayer2);
              if (!sp) { this.pending[v.id] = v; return; }
              inv().matchData.players[v.id][0] = v.ch;
              sp.__remote = true;
              try { sp.emblem = v.team; sp.updateClub(); } finally { sp.__remote = false; }
            },
            onSelectReady: function (state) {
              if (!ns.online) return;
              this.sel = state;
              var me = ns.names[ns.mySide], other = ns.names[1 - ns.mySide];
              banner('ONLINE – you are ' + me + ' (' + (ns.mySide === 0 ? 'left' : 'right') + ') vs ' + other + '. Pick your own team & player. ' +
                     (ns.isHost ? 'Press PLAY when ready.' : 'Waiting for the host to press PLAY.'));
              var self = this;
              Object.keys(this.pending).forEach(function (k) { self.apply(self.pending[k]); });
              this.pending = {};
              this.last = {};
              this.changed(ns.mySide);
            },
            hostStart: function () {
              var md = inv().matchData;
              socket.emit('start_match', { teams: md.teams.slice(), players: [[md.players[0][0]], [md.players[1][0]]] });
            }
          };

          /* ================= lobby wiring ================= */
          $('net-show-host').onclick = function () { lobbyPane('net-host'); };
          $('net-show-join').onclick = function () { lobbyPane('net-join'); };
          $('net-host-back').onclick = $('net-join-back').onclick = function () { lobbyPane('net-menu'); };
          $('net-lobby-close').onclick = function () { showEl('net-lobby', false); };
          $('net-wait-leave').onclick = function () { window.NetUI.leave(); };
          $('net-private').onchange = function (e) { $('net-key').style.display = e.target.checked ? 'block' : 'none'; };
          $('net-create').onclick = function () {
            var n = requireName(); if (!n) return;
            socket.emit('create_room', { isPrivate: $('net-private').checked, passkey: $('net-key').value, name: n });
          };
          $('net-join-go').onclick = function () {
            var n = requireName(); if (!n) return;
            socket.emit('join_room', { roomId: $('net-join-id').value, passkey: $('net-join-key').value, name: n });
          };
          $('net-start').onclick = function () { socket.emit('start_select'); };
          window.joinPublic = function (id) {
            var n = requireName(); if (!n) return;
            socket.emit('join_room', { roomId: id, passkey: null, name: n });
          };

          socket.on('public_rooms_update', function (rooms) {
            var box = $('net-rooms'); box.innerHTML = '';
            if (!rooms.length) { box.innerHTML = '<p style="color:#888;">No public games available.</p>'; return; }
            rooms.forEach(function (r) {
              var d = document.createElement('div'); d.className = 'net-room';
              var sp = document.createElement('span'); sp.textContent = r.hostName + ' · ' + r.roomId;
              var b = document.createElement('button'); b.className = 'net-btn'; b.style.cssText = 'width:70px;margin:0;padding:6px;'; b.textContent = 'Join';
              b.onclick = function () { window.joinPublic(r.roomId); };
              d.appendChild(sp); d.appendChild(b); box.appendChild(d);
            });
          });
          socket.on('room_created', function (d) {
            role = 'host'; lobbyPane('net-wait');
            $('net-wait-text').innerHTML = 'Room code: <b style="font-size:22px">' + d.roomId + '</b><br>Waiting for Player 2…';
            $('net-start').style.display = 'none';
          });
          socket.on('joined_room', function (d) {
            role = 'guest'; lobbyPane('net-wait');
            $('net-wait-text').textContent = 'Connected to ' + d.hostName + ' (' + d.roomId + '). Waiting for the host…';
            $('net-start').style.display = 'none';
          });
          socket.on('player_connected', function (d) {
            var t = $('net-wait-text'); t.textContent = '';
            var b = document.createElement('span'); b.style.color = '#2ee66b';
            b.textContent = (d && d.name ? d.name : 'Player 2') + ' joined!';
            t.appendChild(b);
            $('net-start').style.display = 'block';
          });
          socket.on('join_error', function (m) { $('net-status').textContent = m; });

          socket.on('enter_select', function (d) {
            showEl('net-lobby', false);
            ns.online = true; ns.isHost = role === 'host'; ns.isGuest = role === 'guest';
            ns.mySide = ns.isHost ? 0 : 1; ns.inGame = false;
            ns.names = (d && d.names) || ['Player 1', 'Player 2'];
            window.latestHostState = null; window.remoteP2Input = null; window.netEvtQueue.length = 0;
            startPeer(ns.isHost);   // direct link is negotiated while players pick their teams
            var cb = enterCb; enterCb = null;
            if (cb) cb();   // runs the game's own 2-player flow -> native selector
          });

          /* ================= selector + match start ================= */
          socket.on('peer_pick', function (v) { window.NetSel.apply(v); });
          socket.on('net_start', function (payload) {
            window.latestHostState = null; window.remoteP2Input = null; window.netEvtQueue.length = 0;
            rematchAsked = false; banner(null);
            var st = window.NetSel.sel || window.Phaser.GAMES[0].state.getCurrentState();
            st.netStart(payload);
          });

          /* ================= gameplay relays ================= */
          socket.on('snap', onSnap);
          socket.on('evt', onEvt);
          socket.on('g_input', function (d) { window.remoteP2Input = d; });

          /* ================= ping meter (player <-> player round trip) ================= */
          socket.on('rtt_ping', function (d) { socket.emit('rtt_pong', d); });
          socket.on('rtt_pong', onPong);
          var lastPath = '';
          setInterval(function () {
            var el = $('net-ping');
            if (!ns.online) { el.style.display = 'none'; return; }
            var path = window.NetPath();
            if (path !== lastPath) { lastPath = path; window.NetPing.rtt = 0; }   // re-measure when the route changes
            var ping = { t: performance.now() };
            if (!dcSend(P.u, 'rtt_ping', ping)) socket.emit('rtt_ping', ping);
            var r = window.NetPing.rtt;
            var tr = (socket.io && socket.io.engine && socket.io.engine.transport) ? socket.io.engine.transport.name : '?';
            var route = path === 'p2p' ? 'P2P direct' : 'relay (' + (tr === 'polling' ? 'polling – WebSocket blocked?' : tr) + ')';
            var warn = '';
            if (window.__NET_BUILD !== 3) warn = '  ⚠ OLD GAME FILE – hard refresh (Ctrl+Shift+R)';
            var dbg = window.NetDebug || {};
            if (dbg.youErr) warn += '  ⚠ label: ' + dbg.youErr;
            if (dbg.predErr) warn += '  ⚠ predict: ' + dbg.predErr;
            if (dbg.hostErr) warn += '  ⚠ host: ' + dbg.hostErr;
            el.style.display = 'block';
            el.textContent = (r ? 'ping ' + Math.round(r) + ' ms' : 'ping …') + ' · ' + route + warn;
            el.style.color = warn ? '#ff8a8a' : !r ? '#ccc' : r < 80 ? '#6dff8a' : r < 160 ? '#ffd54a' : '#ff6b6b';
          }, 1000);

          /* ================= rematch / disconnect ================= */
          socket.on('peer_wants_rematch', function () { toast('Opponent wants a rematch – press RESTART to accept', 4000); });
          socket.on('net_rematch', function () {
            window.latestHostState = null; window.remoteP2Input = null; window.netEvtQueue.length = 0;
            rematchAsked = false;
            window.Phaser.GAMES[0].state.getCurrentState().netRematch();
          });
          socket.on('opponent_disconnected', function () {
            if (ns.online) { alert('Opponent disconnected.'); location.reload(); }
            else { lobbyPane('net-menu'); $('net-status').textContent = 'Opponent left the room.'; role = null; }
          });
        })();
        </script>
    </body>
</html>
