<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
        <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
        <title>Basketball Stars | 3kh0</title>

        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <style>
          body { margin: 0; padding: 0; }
          #content { width: 100%; height: 100%; overflow: hidden; }
        </style>
    </head>
    <script src="/js/main.js"></script>
    <body>
        <div id="content"></div>
        <div id="orientation"></div>
        <div id="loader">Loading ...</div>
        
        <!-- ERROR LOGGING CONTAINER -->
        <div id="debug-log" style="position:fixed; bottom:10px; left:10px; color:#ff3333; background:rgba(0,0,0,0.8); z-index:99999; font-family:monospace; font-size:12px; pointer-events:none; padding:5px; border-radius:4px; max-width:400px; max-height:200px; overflow-y:auto;"></div>
        
        <script>
            // Capture errors and display them on the bottom left
            window.addEventListener('error', (event) => {
                const log = document.getElementById('debug-log');
                log.innerHTML += `<div>ERROR: ${event.message}</div>`;
            });
        </script>

        <script type="text/javascript" src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
        <script type="text/javascript" src="assets/box2dweb/nape.min.js">
            var nape ="nape.min.js" ;
        </script>
        <script type="text/javascript" src="assets/box2dweb/nape-debug-draw.min.js"></script>
        <script type="text/javascript" src="assets/box2dweb/jquery-3.1.1.min.js"></script>
        <script type="text/javascript" src="assets/box2dweb/easeljs-0.8.2.combined.js"></script>
        <script type="text/javascript" src="assets/box2dweb/bluebird.min.js"></script>
        <script type="text/javascript">
            var useEvents = typeof Event === "function";

            var myDispatchEvent = function (name) {
                var event;
                if (useEvents) {
                    event = new Event(name);
                } else {
                    event = document.createEvent("Event");
                    event.initEvent(name, true, true);
                }
                document.getElementById("content").dispatchEvent(event);
            };

            window["GD_OPTIONS"] = {
                gameId: "69d78d071f704fa183d75b4114ae40ec",
                onEvent: function (event) {
                    switch (event.name) {
                        case "SDK_GAME_START":
                            myDispatchEvent("SDK_GAME_START");
                            break;
                        case "SDK_GAME_PAUSE":
                            myDispatchEvent("SDK_GAME_PAUSE");
                            break;
                    }
                },
            };
            (function (d, s, id) {
                var js,
                    fjs = d.getElementsByTagName(s)[0];
                if (d.getElementById(id)) return;
                js = d.createElement(s);
                js.id = id;
                js.src = "assets/main.min.js";
                fjs.parentNode.insertBefore(js, fjs);
            })(document, "script", "gamedistribution-jssdk");
        </script>
        <script type="text/javascript" src="assets/basketball_legends_2019.min.js"></script>

        <!-- MULTIPLAYER & TWO-PLAYER UI -->
        <style>
          #game-mode-select {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111e2e;
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            font-family: Arial, sans-serif;
            z-index: 10000;
            text-align: center;
          }

          #mp-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111e2e;
            color: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            font-family: Arial, sans-serif;
            z-index: 10000;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
          }

          #char-select-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111e2e;
            color: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            font-family: Arial, sans-serif;
            z-index: 10000;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
          }

          .mp-btn, .mode-btn, .char-btn {
            background: #00ccff;
            border: none;
            padding: 10px 16px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 6px;
            font-size: 14px;
          }

          .mode-btn {
            padding: 15px 30px;
            font-size: 18px;
            width: 200px;
            margin: 10px;
          }

          .char-btn {
            width: 80px;
            height: 80px;
            padding: 5px;
            display: inline-block;
            text-align: center;
            font-size: 10px;
            vertical-align: top;
          }

          .char-btn.selected {
            background: #00ff00;
            border: 3px solid #fff;
          }

          .mp-input {
            width: 93%;
            padding: 8px;
            margin: 6px 0;
            background: #0b141f;
            border: 1px solid #334e68;
            color: #fff;
            border-radius: 4px;
          }
          .room-card {
            background: #1b2a3a;
            padding: 8px;
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
          }
        </style>

        <!-- Game Mode Selection -->
        <div id="game-mode-select">
          <h2>Select Game Mode</h2>
          <button class="mode-btn" id="btn-online-multiplayer">Online Multiplayer</button>
          <button class="mode-btn" id="btn-local-2player">Local 2 Player</button>
        </div>

        <!-- Multiplayer Lobby UI -->
        <div id="mp-modal" style="display:none;">
          <h2 style="margin-top:0;">Online Matchmaking</h2>
          
          <div id="lobby-menu">
            <button class="mp-btn" id="btn-show-host">Host Game</button>
            <button class="mp-btn" id="btn-show-private">Join with Key</button>
            <hr style="border-color:#334e68; margin: 15px 0;">
            <h4>Public Rooms:</h4>
            <div id="public-room-list" style="max-height:120px; overflow-y:auto;">
              <p style="color:#888;">No public games available.</p>
            </div>
          </div>

          <!-- Host Setup Panel -->
          <div id="host-panel" style="display:none;">
            <h4>Create Room</h4>
            <label>
              <input type="checkbox" id="check-private"> Private Room
            </label>
            <input type="text" id="host-key" class="mp-input" placeholder="Set Key / Password" style="display:none;">
            <button class="mp-btn" id="btn-create-room">Start Hosting</button>
            <button class="mp-btn" style="background:#666;" onclick="showMenu()">Back</button>
          </div>

          <!-- Private Join Panel -->
          <div id="private-panel" style="display:none;">
            <h4>Join Private Game</h4>
            <input type="text" id="join-room-id" class="mp-input" placeholder="Room Code (e.g. AB12C)">
            <input type="text" id="join-room-key" class="mp-input" placeholder="Room Key / Password">
            <button class="mp-btn" id="btn-submit-private">Connect</button>
            <button class="mp-btn" style="background:#666;" onclick="showMenu()">Back</button>
          </div>

          <div id="mp-status" style="margin-top:10px; color:#00ffcc; text-align:center;"></div>
        </div>

        <!-- Character Selection -->
        <div id="char-select-modal" style="display:none;">
          <h2>Select Your Player</h2>
          <p id="char-select-status">Waiting for opponent...</p>
          <div id="char-grid" style="text-align: center; margin: 20px 0;"></div>
          <button class="mp-btn" id="btn-char-ready" style="display:none;">READY</button>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
          const socket = io();
          window.socket = socket;
          window.netState = { isHost: false, isGuest: false, inGame: false };
          window.latestHostState = null;
          window.remoteP2Input = null;
          window.selectedChar = null;
          window.opponentChar = null;

          // GAME MODE SELECTION
          document.getElementById('btn-online-multiplayer').onclick = () => {
            document.getElementById('game-mode-select').style.display = 'none';
            document.getElementById('mp-modal').style.display = 'block';
          };

          document.getElementById('btn-local-2player').onclick = () => {
            document.getElementById('game-mode-select').style.display = 'none';
            startLocal2Player();
          };

          function showMenu() {
            document.getElementById('lobby-menu').style.display = 'block';
            document.getElementById('host-panel').style.display = 'none';
            document.getElementById('private-panel').style.display = 'none';
          }

          document.getElementById('btn-show-host').onclick = () => {
            document.getElementById('lobby-menu').style.display = 'none';
            document.getElementById('host-panel').style.display = 'block';
          };

          document.getElementById('btn-show-private').onclick = () => {
            document.getElementById('lobby-menu').style.display = 'none';
            document.getElementById('private-panel').style.display = 'block';
          };

          document.getElementById('check-private').onchange = (e) => {
            document.getElementById('host-key').style.display = e.target.checked ? 'block' : 'none';
          };

          document.getElementById('btn-create-room').onclick = () => {
            const isPrivate = document.getElementById('check-private').checked;
            const passkey = document.getElementById('host-key').value;
            socket.emit('create_room', { isPrivate, passkey });
          };

          document.getElementById('btn-submit-private').onclick = () => {
            const roomId = document.getElementById('join-room-id').value;
            const passkey = document.getElementById('join-room-key').value;
            socket.emit('join_room', { roomId, passkey });
          };

          socket.on('public_rooms_update', (rooms) => {
            const container = document.getElementById('public-room-list');
            if (!rooms.length) {
              container.innerHTML = '<p style="color:#888;">No public games available.</p>';
              return;
            }
            container.innerHTML = '';
            rooms.forEach((r) => {
              const card = document.createElement('div');
              card.className = 'room-card';
              card.innerHTML = `<span>${r.roomId}</span><button class="mp-btn" style="width:70px; margin:0;" onclick="joinPublic('${r.roomId}')">Join</button>`;
              container.appendChild(card);
            });
          });

          window.joinPublic = (roomId) => {
            socket.emit('join_room', { roomId, passkey: null });
          };

          socket.on('room_created', ({ roomId, isPrivate }) => {
            window.netState.isHost = true;
            document.getElementById('mp-modal').innerHTML = `
              <h2>Room: ${roomId}</h2>
              <p>Waiting for Player 2...</p>
              <button class="mp-btn" id="btn-force-start" style="display:none; background:#0f0; margin-top:15px;">START MATCH</button>
            `;
            
            document.getElementById('btn-force-start').onclick = () => {
              socket.emit('force_start_match');
            };
          });

          socket.on('joined_room', ({ roomId }) => {
            window.netState.isGuest = true;
            document.getElementById('mp-modal').innerHTML = `<h2>Connected to ${roomId}</h2><p>Waiting for Host to start match...</p>`;
          });

          socket.on('player_connected', () => {
            const startBtn = document.getElementById('btn-force-start');
            if(startBtn) startBtn.style.display = 'block';
          });

          // LISTEN FOR STATE SYNC (guest receives physics data)
          socket.on('sync_state', (data) => {
            window.latestHostState = data;
          });

          // LISTEN FOR INPUT SYNC (host receives guest input)
          socket.on('sync_input', (data) => {
            window.remoteP2Input = data;
          });

          // CHARACTER SELECTION SYNC
          socket.on('opponent_selected_char', (charId) => {
            window.opponentChar = charId;
            updateCharSelectUI();
          });

          // LISTEN FOR ERRORS
          socket.on('join_error', (msg) => {
            document.getElementById('mp-status').textContent = 'ERROR: ' + msg;
          });

          // LISTEN FOR OPPONENT DISCONNECT
          socket.on('opponent_disconnected', () => {
            if (window.netState.inGame) {
              alert('Opponent disconnected!');
              location.reload();
            }
          });

          // MATCH ENDED (guest receives end signal)
          socket.on('match_ended', (data) => {
            console.log('Match ended:', data);
            // The game will handle the end screen
          });

          // START MATCH & CHARACTER SELECTION
          socket.on('jump_to_arena', () => {
            try {
              document.getElementById('game-mode-select').style.display = 'none';
              document.getElementById('mp-modal').style.display = 'none';
              document.getElementById('char-select-modal').style.display = 'block';
              
              showCharacterSelection();
            } catch (err) {
              const log = document.getElementById('debug-log');
              log.innerHTML += `<div>CRASH in jump_to_arena: ${err.message}</div>`;
              console.error(err);
            }
          });

          function showCharacterSelection() {
            const charGrid = document.getElementById('char-grid');
            charGrid.innerHTML = '';
            
            // Placeholder character IDs (0-5 typically)
            const characters = [0, 1, 2, 3, 4, 5];
            
            characters.forEach(charId => {
              const btn = document.createElement('button');
              btn.className = 'char-btn';
              btn.textContent = `Player ${charId}`;
              btn.onclick = () => selectCharacter(charId);
              charGrid.appendChild(btn);
            });
            
            document.getElementById('btn-char-ready').style.display = 'block';
            updateCharSelectUI();
          }

          function selectCharacter(charId) {
            window.selectedChar = charId;
            // Tell opponent
            if (window.socket) {
              window.socket.emit('select_character', charId);
            }
            updateCharSelectUI();
          }

          function updateCharSelectUI() {
            const btns = document.querySelectorAll('.char-btn');
            btns.forEach((btn, idx) => {
              if (idx === window.selectedChar) {
                btn.classList.add('selected');
              } else {
                btn.classList.remove('selected');
              }
            });
            
            let status = 'You: ' + (window.selectedChar !== null ? 'Ready ✓' : 'Choose');
            if (window.opponentChar !== null) {
              status += ' | Opponent: Ready ✓';
            } else {
              status += ' | Opponent: Waiting';
            }
            document.getElementById('char-select-status').textContent = status;
          }

          document.getElementById('btn-char-ready').onclick = () => {
            if (window.selectedChar === null) {
              alert('Please select a character first!');
              return;
            }
            startMultiplayer();
          };

          function startMultiplayer() {
            try {
              document.getElementById('char-select-modal').style.display = 'none';
              window.netState.inGame = true;

              const inv = window.GameInventory.instance;
              if (!inv) throw new Error("Inventory not found");

              inv.gameMode = 4; // PvP mode
              inv.matchData.matchMode = 0;
              inv.matchData.teams = [0, 1];
              inv.matchData.players = [[window.selectedChar], [window.opponentChar || 0]];
              inv.matchData.pb = [[false], [false]]; // pb = is AI?
              inv.matchData.skills = [[0], [0]];
              inv.matchData.forms = [[0], [0]];

              window.Phaser.GAMES[0].state.start("gameplay");
            } catch (err) {
              const log = document.getElementById('debug-log');
              log.innerHTML += `<div>CRASH: ${err.message}</div>`;
              console.error(err);
            }
          }

          function startLocal2Player() {
            try {
              const inv = window.GameInventory.instance;
              if (!inv) throw new Error("Inventory not found");

              inv.gameMode = 4; // PvP mode
              inv.matchData.matchMode = 0;
              inv.matchData.teams = [0, 1];
              inv.matchData.players = [[0], [0]]; // Both player 0 for now
              inv.matchData.pb = [[false], [false]];
              inv.matchData.skills = [[0], [0]];
              inv.matchData.forms = [[0], [0]];

              window.Phaser.GAMES[0].state.start("gameplay");
            } catch (err) {
              const log = document.getElementById('debug-log');
              log.innerHTML += `<div>CRASH in local 2P: ${err.message}</div>`;
              console.error(err);
            }
          }

          function bindGuestInputListeners() {
            const keyMap = { KeyA: 'left', KeyD: 'right', KeyW: 'jump', KeyS: 'down', KeyB: 'action', KeyV: 'super' };
            const keys = { left: false, right: false, jump: false, down: false, action: false, super: false };

            window.addEventListener('keydown', (e) => {
              if (keyMap[e.code]) {
                keys[keyMap[e.code]] = true;
                if (window.socket) window.socket.emit('guest_input', keys);
              }
            });

            window.addEventListener('keyup', (e) => {
              if (keyMap[e.code]) {
                keys[keyMap[e.code]] = false;
                if (window.socket) window.socket.emit('guest_input', keys);
              }
            });
          }

          // Bind input listeners when guest joins
          socket.on('joined_room', () => {
            bindGuestInputListeners();
          });

          // Initial room list
          socket.emit('get_public_rooms');
        </script>
    </body>
</html>
